<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardiología Clínica · Estudio</title>
<meta name="description" content="Repaso de cardiología clínica: temas, algoritmos, glosario y modo de estudio con progreso guardado en el navegador.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <h1>Cardiología Clínica</h1>
  <p class="subtitle">Repaso para la práctica clínica</p>
</header>

<nav class="tabs" aria-label="Secciones">
  <button class="tab-btn active" data-tab="temas" type="button">Temas</button>
  <button class="tab-btn" data-tab="algoritmos" type="button">Algoritmos</button>
  <button class="tab-btn" data-tab="glosario" type="button">Glosario</button>
  <button class="tab-btn" data-tab="estudiar" type="button">Estudiar</button>
  <button class="tab-btn" data-tab="ecg" type="button">ECG</button>
</nav>

<main id="app">

  <section id="tab-temas" class="tab-panel active">
    <div id="temas-lista" class="card-list"></div>
    <div id="tema-detalle" class="detail hidden"></div>
  </section>

  <section id="tab-algoritmos" class="tab-panel">
    <div id="algoritmos-lista" class="card-list"></div>
  </section>

  <section id="tab-glosario" class="tab-panel">
    <input id="glosario-buscar" type="search" placeholder="Buscar término…" class="search-input">
    <div id="glosario-lista" class="glossary-list"></div>
  </section>

  <section id="tab-estudiar" class="tab-panel">
    <div id="estudiar-inicio">
      <div class="progress-summary">
        <p id="progreso-texto">Cargando progreso…</p>
        <div class="progress-bar"><div id="progreso-barra" class="progress-bar-fill"></div></div>
      </div>
      <button id="btn-iniciar-quiz" class="btn-primary" type="button">Iniciar repaso</button>
      <button id="btn-reset-progreso" class="btn-secondary" type="button">Reiniciar progreso</button>
    </div>
    <div id="quiz-container" class="hidden"></div>
  </section>

  <section id="tab-ecg" class="tab-panel">
    <div id="ecg-lista-vista">
      <div class="progress-summary">
        <p id="ecg-resumen">Cargando casos…</p>
      </div>
      <div class="ecg-filtros">
        <button class="ecg-filtro active" data-filtro="todos" type="button">Todos</button>
        <button class="ecg-filtro" data-filtro="pendiente" type="button">Pendientes</button>
        <button class="ecg-filtro" data-filtro="repasar" type="button">Para repasar</button>
        <button class="ecg-filtro" data-filtro="dominado" type="button">Dominados</button>
      </div>
      <div id="ecg-lista" class="card-list"></div>
    </div>
    <div id="ecg-detalle" class="detail hidden"></div>
  </section>

</main>

<p id="estado-carga" class="estado-carga"></p>

<script src="js/ecg.js"></script>
<script src="js/app.js"></script>
</body>
</html>
